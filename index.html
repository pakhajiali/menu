<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restoran Pak Haji Ali & Muiz Hot Chicken</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    margin:0;
}

.header{
    background:white;
    padding:20px;
    font-size:22px;
    font-weight:bold;
    text-align:center;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.product{
    background:white;
    margin:10px;
    padding:10px;
    border-radius:12px;
    display:flex;
    align-items:center;
}

.product img{
    width:120px;
    height:120px;
    border-radius:12px;
    object-fit:cover;
    margin-right:15px;
}

.name{
    font-size:22px;
    font-weight:bold;
}

.desc{
    color:#666;
    margin-top:8px;
}

.price{
    font-size:28px;
    font-weight:bold;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="header">
    Restoran Pak Haji Ali <br>
    & Muiz Hot Chicken
</div>

<div class="product">
    <img src="originalregularbox.jpg" alt="Original Regular Box">
    <div>
        <div class="name">Original Regular Box</div>
        <div class="desc">2 Ketul Ayam Goreng Rangup Muiz</div>
        <div class="price">RM9.00</div>
    </div>
</div>

<div class="product">
    <img src="cheeseregularbox.jpg" alt="Cheese Regular Box">
    <div>
        <div class="name">Cheese Regular Box</div>
        <div class="desc">2 Ketul Ayam Goreng + Cheese Sauce</div>
        <div class="price">RM11.00</div>
    </div>
</div>

<div class="product">
    <img src="koreanspicyregularbox.jpg" alt="Korean Spicy Regular Box">
    <div>
        <div class="name">Korean Spicy Regular Box</div>
        <div class="desc">2 Ketul Ayam Goreng + Korean Sauce</div>
        <div class="price">RM12.00</div>
    </div>
</div>

</body>
</html>
