<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Restoran Pak Haji Ali & Muiz Hot Chicken</title>

<!-- Logo on browser tab -->
<link rel="icon" type="image/jpg" href="logo.jpg">

<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    margin:0;
}

.header{
    background:white;
    padding:20px;
    text-align:center;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.header img{
    width:90px;
    height:90px;
    object-fit:contain;
    margin-bottom:10px;
}

.header-title{
    font-size:24px;
    font-weight:bold;
    color:#222;
    line-height:1.3;
}

.header-subtitle{
    color:#888;
    margin-top:5px;
    font-size:14px;
}

.product{
    background:white;
    margin:10px;
    padding:10px;
    border-radius:12px;
    display:flex;
    align-items:center;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.product img{
    width:120px;
    height:120px;
    border-radius:12px;
    object-fit:cover;
    margin-right:15px;
}

.name{
    font-size:22px;
    font-weight:bold;
}

.desc{
    color:#666;
    margin-top:8px;
}

.price{
    font-size:28px;
    font-weight:bold;
    color:#d62828;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="header">
    <img src="logo.jpg" alt="Restaurant Logo">

    <div class="header-title">
        Restoran Pak Haji Ali<br>
        & Muiz Hot Chicken
    </div>

    <div class="header-subtitle">
        Crispy Chicken • Catering • Family Restaurant
    </div>
</div>

<div class="product">
    <img src="originalregularbox.jpg" alt="Original Regular Box">
    <div>
        <div class="name">Original Regular Box</div>
        <div class="desc">2 Ketul Ayam Goreng Rangup Muiz</div>
        <div class="price">RM9.00</div>
    </div>
</div>

<div class="product">
    <img src="cheeseregularbox.jpg" alt="Cheese Regular Box">
    <div>
        <div class="name">Cheese Regular Box</div>
        <div class="desc">2 Ketul Ayam Goreng + Cheese Sauce</div>
        <div class="price">RM11.00</div>
    </div>
</div>

<div class="product">
    <img src="koreanspicyregularbox.jpg" alt="Korean Spicy Regular Box">
    <div>
        <div class="name">Korean Spicy Regular Box</div>
        <div class="desc">2 Ketul Ayam Goreng + Korean Sauce</div>
        <div class="price">RM12.00</div>
    </div>
</div>

</body>
</html>
